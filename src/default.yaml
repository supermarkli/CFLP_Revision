data:
  clients:
  - data/client1/
  - data/client2/
  - data/client3/
  complete: data/complete/
  dataset: cifar10
  federated_dist: noniid_dirichlet # noniid_label_skew noniid_quantity_skew iid noniid_dirichlet
federated:
  aggregation: fedavg
  local_epochs: 5
  num_clients: 3
  rounds: 10000  # 设置足够大，依靠收敛检测自动停止
log_dir: logs/
mode: Federated
model:
  MLP:
    activation: relu
    hidden_dims:
    - 128
    - 64
  ml:
    KNN:
      algorithm: auto
      n_neighbors: 5
      weights: uniform
    LR:
      C: 1.0
      class_weight: balanced
      max_iter: 5000
      tol: 0.001
    RF:
      class_weight: balanced
      max_depth: null
      max_features: sqrt
      min_samples_leaf: 1
      min_samples_split: 2
      n_estimators: 100
    SVC:
      C: 1.0
      class_weight: balanced
      max_iter: 5000
      tol: 0.001
  type: ResNet18
seed: 0
training:
  batch_size: 128
  compute_auc: true
  converge_threshold: 0.005
  epochs: 10000  # 最大轮数，设置足够大，依靠收敛检测自动停止
  estimated_rounds: 200  # 预估收敛轮数，用于学习率调度器
  eval_batch_size: 128
  eval_interval: 1  # 每轮都评估，方便画收敛曲线
  gamma: 0.2
  learning_rate: 0.01
  milestones:
  - 60
  - 120
  - 160
  momentum: 0.9
  num_threads: null
  num_workers: 4
  optimizer: sgd
  prefetch_factor: 2
  scheduler: cosine
  use_amp: true
  use_augmentation: true
  weight_decay: 0.0005
